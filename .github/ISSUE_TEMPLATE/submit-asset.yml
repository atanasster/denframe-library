name: Submit an asset
description: Propose a portable asset for review.
body:
  - type: markdown
    attributes:
      value: "Start at https://smart.meggy.com/library/submit: it checks the file in your browser, makes the `.zip` copy GitHub accepts and fills this form. This issue is public. Remove personal data and credentials. Read https://smart.meggy.com/terms and https://smart.meggy.com/privacy."
  - type: textarea
    id: asset
    attributes:
      label: Asset and source
      description: Attach the `.zip` copy the Submit page makes (GitHub does not accept `.denframepack`), with its ID and version. Over 20 MB, open a pull request instead.
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Licence and credits
      description: Name the licence, all creators and resource sources, and AI-generation disclosures.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Audience and review
      description: For activities, state audience/age, languages and human checks completed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation and previews
      description: The Submit page's format report summary, and the landscape, portrait and square previews it drew.
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Rights and privacy
      options:
        - label: I have the rights to share this material under the stated licences, retained required credits, and removed household and private data.
          required: true
