name: Public library checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  # Who may change what (tools/pr_gate.py). The base commit is checked out and the head is
  # fetched as git objects only: nothing from the head is installed, imported or run, and the
  # author's numeric id comes from the event (set by GitHub) through the environment. This is an
  # early, ADVISORY signal: a pull_request workflow comes from the pull request, which can edit
  # it. The gate that decides is the owner's merge command, tools/merge_pr.py (README).
  # pull_request only, never pull_request_target: no secret or write token is in reach.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the head commit as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - name: Publisher and maintainer gate (advisory)
        env:
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I tools/pr_gate.py --repo . --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --author-id "$PR_AUTHOR_ID"
  validate:
    needs: gate
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The pinned release environment (format/release-environment.json): the rebuild gate
    # refuses any other runtime.
    container: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python -m pip install --root-user-action=ignore --require-hashes -r format/requirements.lock
      - run: python -m pip install --root-user-action=ignore --no-deps ./format
      - run: python tools/check.py
      - name: Rebuild every reviewed asset byte-for-byte
        run: python tools/rebuild.py
  # The review skill's own tests (guard, policy, sandbox, pull-request intake, report): what the
  # host's gate runs over its vendored copy, run here over this tree too.
  skill-tests:
    needs: gate
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
    steps:
      # Before checkout, so the tree is a git clone (the tests read `git ls-files`).
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python -m pip install --root-user-action=ignore --require-hashes -r format/requirements.lock
      - run: python -m pip install --root-user-action=ignore --no-deps ./format
      - run: python -m pip install --root-user-action=ignore --require-hashes -r tests/requirements.lock
      - run: python -m pytest -q -p no:cacheprovider tests
