# The standalone format toolchain's release, on a `format-v*` tag: build the `denframe-format` wheel,
# attach it to the GitHub release and -- once the owner has switched it on -- publish the same
# wheel to PyPI with trusted publishing (OpenID Connect; no API token is stored anywhere).
#
# PyPI publishing stays inert until the owner (host docs/operations/LIBRARY_SOURCE_RELEASES.md, "PyPI
# trusted publishing"): registers a pending trusted publisher for the project `denframe-format` on
# pypi.org (owner atanasster, repository denframe-library, workflow format-release.yml,
# environment pypi), creates the `pypi` environment here (deployment tags `format-v*` only),
# and sets the repository variable PYPI_PUBLISH to `on`. Only the publish job can mint an
# OIDC token (`id-token: write`), and it runs no code from the repository: it downloads the
# wheel the build job made and hands it to the pinned publish action.
name: Format wheel release
on:
  push:
    tags: ['format-v*']
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r format/requirements.lock
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os,tomllib; v=tomllib.load(open("format/pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "format-v" + v'
      - run: python -m pip install --no-deps ./format
      - run: python tools/check.py
      - run: python -m pip wheel --no-deps ./format --wheel-dir dist
      - name: Keep the wheel for the PyPI job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: denframe-format-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Attach standalone wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl --verify-tag --title "$RELEASE_TAG" --notes "Standalone Denframe format toolchain. Asset sources retain their individual licences and review status."
  pypi:
    needs: wheel
    if: vars.PYPI_PUBLISH == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/denframe-format/
    permissions:
      id-token: write
    steps:
      - name: Take the wheel the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denframe-format-wheel
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
