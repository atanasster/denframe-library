name: Format wheel release
on:
  push:
    tags: ['format-v*']
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r format/requirements.lock
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os,tomllib; v=tomllib.load(open("format/pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "format-v" + v'
      - run: python -m pip install --no-deps ./format
      - run: python tools/check.py
      - run: python -m pip wheel --no-deps ./format --wheel-dir dist
      - name: Attach standalone wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl --verify-tag --title "$RELEASE_TAG" --notes "Standalone Mantel format toolchain. Asset sources retain their individual licences and review status."
