# The daily expiry watch (host docs/operations/LIBRARY_TUF_OPERATIONS.md). Unlike the renewal
# job it is never gated: while renewal stays off (early testing renews by hand), this is what
# tells the owner the served timestamp, snapshot, targets or root is about to lapse. It reads the
# public metadata the website serves -- no secret, no key, no write token -- and fails when any
# role has fewer than three days left (tools/library_served.py `expiry`). A failure opens, or
# comments on, the one open issue labelled `metadata-expiry`.
name: Watch library metadata expiry
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  LIBRARY_ORIGIN: https://denframe.com
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r tools/requirements-release.lock
      - name: Read when each served role expires
        run: python tools/library_served.py expiry --origin "$LIBRARY_ORIGIN"
  alert:
    needs: watch
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the expiry issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Library metadata is near or past its expiry: $RUN_URL. Renew it (LIBRARY_TUF_OPERATIONS.md, renew) before Get more says the library can't be checked."
          number=$(gh issue list --label metadata-expiry --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create metadata-expiry --color D93F0B --description "Served TUF metadata near expiry" --force
            gh issue create --title "Library metadata expires soon" --label metadata-expiry --body "$body"
          fi
