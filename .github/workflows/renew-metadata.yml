# The daily TUF renewal (host docs/operations/LIBRARY_TUF_OPERATIONS.md). The repository hosts
# verify is the one the website serves (https://smart.meggy.com/library/metadata/): that is the
# one source of truth. The job reads the served metadata (public data), verifies it from the
# pinned root (the repository variable LIBRARY_ROOT_SHA256), signs a new snapshot of the unchanged
# targets and then a timestamp for that exact snapshot with the online key only, and publishes
# just those two files to the live Firebase Hosting site: it clones the live release's version,
# adds them through the Hosting REST API and releases it -- never redeploying the site -- then
# checks every role's expiry. It does nothing until the owner sets the repository variable
# LIBRARY_RENEWAL to `on`, after creating the `release` environment with the
# FIREBASE_HOSTING_SERVICE_ACCOUNT secret (and, from the real launch on, the LIBRARY_ONLINE_KEY
# and LIBRARY_ONLINE_PASSPHRASE secrets).
#
# Early testing (host plan §10): until the real launch the site serves a `channel: test`
# repository, signed in every role by the public test key, which `tuf_repository.py --test`
# derives from its published seed -- no key secret exists or is read. The renew step asks the
# verified served repository for its channel: `test` renews with `--test`; production with the
# online key secrets; anything else (a dev repository) is refused before anything is signed.
# That environment is protected by a deployment-branch rule (main only) and has no required
# reviewers: a scheduled job cannot wait for an approval, and a pending one would let the
# timestamp lapse with no alert. A failure opens, or comments on, the one open issue labelled
# `metadata-renewal`. The job's token is read-only; each secret reaches only the one step that
# needs it: the online key the renew step, the Hosting service account the publish step.
name: Renew library metadata
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renew-metadata
  cancel-in-progress: false
env:
  LIBRARY_ORIGIN: https://smart.meggy.com
  HOSTING_SITE: smart-home-cec89
jobs:
  renew:
    if: vars.LIBRARY_RENEWAL == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tools-checkout
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r tools-checkout/tools/requirements-release.lock
      - name: Read and verify the served metadata
        env:
          LIBRARY_ROOT_SHA256: ${{ vars.LIBRARY_ROOT_SHA256 }}
        run: >-
          python tools-checkout/tools/library_served.py pull --origin "$LIBRARY_ORIGIN"
          --root-sha256 "$LIBRARY_ROOT_SHA256" --repository served
      - name: Renew snapshot and timestamp
        env:
          LIBRARY_ONLINE_KEY: ${{ secrets.LIBRARY_ONLINE_KEY }}
          LIBRARY_ONLINE_PASSPHRASE: ${{ secrets.LIBRARY_ONLINE_PASSPHRASE }}
        run: |
          tool=tools-checkout/tools/tuf_repository.py
          channel=$(python "$tool" --repository served channel)
          case "$channel" in
            test) python "$tool" --repository served --test renew ;;
            production) python "$tool" --repository served renew --online-key-env LIBRARY_ONLINE_KEY --online-passphrase-env LIBRARY_ONLINE_PASSPHRASE ;;
            *) echo "Refused: the site serves a $channel repository." >&2; exit 2 ;;
          esac
      - name: Publish the new snapshot and timestamp to the live site
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT }}
        run: >-
          python tools-checkout/tools/library_served.py publish --origin "$LIBRARY_ORIGIN"
          --site "$HOSTING_SITE" --repository served
          --service-account-env FIREBASE_HOSTING_SERVICE_ACCOUNT
      - name: Check every role's expiry
        run: |
          tool=tools-checkout/tools/tuf_repository.py
          channel=$(python "$tool" --repository served channel)
          case "$channel" in
            test) python "$tool" --repository served --test status ;;
            production) python "$tool" --repository served status ;;
            *) echo "Refused: the site serves a $channel repository." >&2; exit 2 ;;
          esac
  alert:
    needs: renew
    if: failure() && vars.LIBRARY_RENEWAL == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the renewal issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Metadata renewal failed: $RUN_URL. Until it is fixed, Get more says the library can't be checked once the timestamp lapses. See LIBRARY_TUF_OPERATIONS.md (lapse)."
          number=$(gh issue list --label metadata-renewal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create metadata-renewal --color B60205 --description "Daily TUF renewal failures" --force
            gh issue create --title "Library metadata renewal failed" --label metadata-renewal --body "$body"
          fi
