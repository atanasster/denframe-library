# The daily TUF renewal (host docs/operations/LIBRARY_TUF_OPERATIONS.md). It signs a new snapshot
# of the unchanged targets, then a timestamp for that exact snapshot, with the online key only, on
# the staging repository kept on the `metadata-staging` branch; then it checks every role's
# expiry. It does nothing until the owner sets the repository variable LIBRARY_RENEWAL to `on`
# at the pre-launch gate, after creating the `release` environment with the LIBRARY_ONLINE_KEY
# and LIBRARY_ONLINE_PASSPHRASE secrets. That environment is protected by a deployment-branch
# rule (main only) and has no required reviewers: a scheduled job cannot wait for an approval,
# and a pending one would let the timestamp lapse with no alert. A failure opens, or comments
# on, the one open issue labelled `metadata-renewal`. The checkout keeps no token; only the
# push step receives one, so the step holding the online key cannot push.
name: Renew library metadata
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renew-metadata
  cancel-in-progress: false
jobs:
  renew:
    if: vars.LIBRARY_RENEWAL == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tools-checkout
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r tools-checkout/tools/requirements-release.lock
      - name: Check out the staging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: metadata-staging
          path: staging
          persist-credentials: false
      - name: Renew snapshot and timestamp
        env:
          LIBRARY_ONLINE_KEY: ${{ secrets.LIBRARY_ONLINE_KEY }}
          LIBRARY_ONLINE_PASSPHRASE: ${{ secrets.LIBRARY_ONLINE_PASSPHRASE }}
        run: >-
          python tools-checkout/tools/tuf_repository.py --repository staging renew
          --online-key-env LIBRARY_ONLINE_KEY --online-passphrase-env LIBRARY_ONLINE_PASSPHRASE
      - name: Push the renewed metadata
        working-directory: staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add metadata
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Renew snapshot and timestamp"
          gh auth setup-git
          git push -q origin HEAD:metadata-staging
      - name: Check every role's expiry
        run: python tools-checkout/tools/tuf_repository.py --repository staging status
  alert:
    needs: renew
    if: failure() && vars.LIBRARY_RENEWAL == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the renewal issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Metadata renewal failed: $RUN_URL. Until it is fixed, Get more says the library can't be checked once the timestamp lapses. See LIBRARY_TUF_OPERATIONS.md (lapse)."
          number=$(gh issue list --label metadata-renewal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create metadata-renewal --color B60205 --description "Daily TUF renewal failures" --force
            gh issue create --title "Library metadata renewal failed" --label metadata-renewal --body "$body"
          fi
